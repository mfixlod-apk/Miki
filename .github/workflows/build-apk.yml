name: Build MFIX Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Miki launcher repository
        uses: actions/checkout@v4
      - name: Checkout complete MFIX POS source
        run: git clone --depth 1 https://github.com/mfixlod-apk/Mfix-pos.git source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Install Android SDK
        run: |
          sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate full source
        working-directory: source
        run: |
          set -euo pipefail
          test -s app/src/main/assets/index.html
          test -s app/src/main/java/com/mfix/pos/MainActivity.java
          test -d app/src/main/assets/content_parts
          test "$(find app/src/main/assets/content_parts -maxdepth 1 -name '[0-9][0-9].js' | wc -l)" -eq 19
      - name: Build release APK
        working-directory: source
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK
        working-directory: source
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: MFIX-POS-APK
          path: source/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
